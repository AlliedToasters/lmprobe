name: Tests

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff-cover

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,auto,nnsight]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/lmprobe/

      - name: Run unit tests with coverage (nnsight-free)
        run: >
          pytest -m "not nnsight" --cov=lmprobe --cov-report=xml
          --cov-report=term-missing --cov-fail-under=30 -v

      - name: Run nnsight integration tests
        run: pytest -m nnsight -v

      - name: Check coverage on changed lines
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
