[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmprobe"
version = "0.9.3"
description = "Train probes on language model activations for AI safety monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Toast" },
]
keywords = [
    "machine-learning",
    "nlp",
    "interpretability",
    "probing",
    "ai-safety",
    "language-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.0",
    "numpy>=1.20",
    "tqdm>=4.0",
    "accelerate>=0.20",
]

[project.optional-dependencies]
nnsight = [
    "nnsight>=0.6,<0.6.2",
]
remote = [
    "nnsight>=0.6,<0.6.2",
]
s3 = [
    "boto3>=1.26",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "diff-cover>=9.0",
    "ruff>=0.1",
    "black>=23.0",
    "moto[s3]>=5.0",
    "mypy>=1.10",
]
auto = [
    "skglm>=0.3",
]
embeddings = [
    "sentence-transformers>=2.0",
]
hub = [
    "huggingface_hub>=0.20",
]
gpu-probes = [
    "cuml-cu12>=24.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-section-index>=0.3",
]

[project.urls]
Homepage = "https://github.com/AlliedToasters/lmprobe"
Documentation = "https://alliedtoasters.github.io/lmprobe"
Repository = "https://github.com/AlliedToasters/lmprobe"

[tool.hatch.build.targets.wheel]
packages = ["src/lmprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "remote: marks tests that require NDIF remote execution (deselect with '-m \"not remote\"')",
    "nnsight: marks tests that load a model via nnsight (disables coverage.py tracing)",
    "gpu: marks tests that require a compatible CUDA GPU (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806"]  # Allow uppercase X, X_train etc. (sklearn convention)

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
